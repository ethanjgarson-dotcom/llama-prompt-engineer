<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0c0c0c;
      --panel:       #111111;
      --raised:      #181818;
      --border:      rgba(255,255,255,0.55);
      --border-hi:   rgba(255,255,255,0.75);
      --text:        #e8e8e8;
      --muted:       #6e6e6e;
      --faint:       #333333;
      --btn-bg:      #e8e8e8;
      --btn-fg:      #0c0c0c;
      --red:         #d95f5f;
      --radius:      6px;
      --font:        'JetBrains Mono', 'Menlo', monospace;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ─────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 2px; }

    /* ── Layout shell ──────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      border: 1px solid var(--border);
    }

    /* ── Header ────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      height: 50px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      font-weight: 500;
      font-size: 13px;
      color: var(--text);
    }

    .logo-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text);
      flex-shrink: 0;
    }

    .logo-version {
      font-size: 11px;
      color: var(--faint);
      font-weight: 300;
    }

    /* Mode tabs */
    .tabs {
      display: flex;
      gap: 2px;
      flex: 1;
      justify-content: center;
    }

    .tab {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      font-family: var(--font);
      font-size: 11px;
      color: #aaaaaa;
      padding: 5px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.02em;
      font-weight: 400;
    }

    .tab:hover {
      background: rgba(255,255,255,0.14);
      color: #cccccc;
    }

    .tab.active {
      background: #f0f0f0;
      border-color: #f0f0f0;
      color: #0c0c0c;
      font-weight: 600;
    }

    /* Right side of header */
    .header-end {
      display: flex;
      align-items: center;
      gap: 16px;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--faint);
      transition: background 0.3s;
    }

    .status-dot.online { background: #5a9e6f; }

    .header-label {
      font-size: 11px;
      color: var(--muted);
      cursor: default;
      letter-spacing: 0.02em;
    }

    /* ── Body ──────────────────────────────────────── */
    .body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Left panel ────────────────────────────────── */
    .panel-left {
      width: 300px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-section {
      padding: 20px;
    }

    .panel-section + .panel-section {
      border-top: 1px solid var(--border);
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* Idea textarea */
    .idea-wrap {
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      transition: border-color 0.12s;
    }

    .idea-wrap:focus-within { border-color: var(--border-hi); }

    .idea-textarea {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.6;
      resize: none;
      min-height: 80px;
      max-height: 160px;
      overflow-y: auto;
    }

    .idea-textarea::placeholder { color: var(--faint); }

    .char-count {
      font-size: 10px;
      color: var(--faint);
      text-align: right;
      margin-top: 6px;
    }

    /* Mode buttons */
    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      overflow-y: auto;
    }

    .mode-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius);
      border: none;
      background: none;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: background 0.1s;
      font-family: var(--font);
    }

    .mode-btn:hover { background: var(--raised); }

    .mode-btn.active { background: var(--raised); }

    .mode-indicator {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--faint);
      margin-top: 5px;
      flex-shrink: 0;
      transition: background 0.12s;
    }

    .mode-btn.active .mode-indicator { background: var(--text); }

    .mode-text {}

    .mode-name {
      font-size: 12px;
      color: var(--faint);
      font-weight: 400;
      display: block;
      transition: color 0.12s;
    }

    .mode-btn.active .mode-name { color: var(--text); }

    .mode-desc {
      font-size: 10px;
      color: var(--faint);
      line-height: 1.5;
      margin-top: 2px;
      display: none;
    }

    .mode-btn.active .mode-desc { display: block; color: var(--muted); }

    /* Action row */
    .actions {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-record {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 14px;
      height: 36px;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .btn-record:hover { border-color: var(--border-hi); color: var(--text); }

    .btn-record.recording {
      border-color: var(--red);
      color: var(--red);
    }

    .btn-record.recording .rec-dot { animation: rec-pulse 1s infinite; }

    @keyframes rec-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .rec-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .btn-refine {
      flex: 1;
      height: 36px;
      background: var(--btn-bg);
      border: none;
      border-radius: var(--radius);
      color: var(--btn-fg);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      letter-spacing: 0.02em;
    }

    .btn-refine:hover { opacity: 0.88; }
    .btn-refine:active { opacity: 0.78; }
    .btn-refine:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Right panel ───────────────────────────────── */
    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .output-header {
      height: 50px;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .output-mode-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .output-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 12px;
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-sm:hover { border-color: var(--border-hi); color: var(--text); }
    .btn-sm.active { color: var(--text); }

    /* Output body */
    .output-body {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      display: flex;
    }

    .output-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888888;
      font-size: 13px;
      text-align: center;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    .output-text {
      color: var(--text);
      font-size: 13px;
      line-height: 1.85;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1;
    }

    /* Skeleton loader */
    .skeleton {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .skel-line {
      height: 11px;
      background: var(--raised);
      border-radius: 4px;
      animation: skel-shimmer 1.4s ease-in-out infinite;
    }

    @keyframes skel-shimmer {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 0.55; }
    }

    /* Streaming cursor */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: var(--muted);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.9s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Adjust section */
    .adjust-section {
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: none;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .adjust-section.visible { display: flex; }

    .adjust-input {
      flex: 1;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      outline: none;
      resize: none;
      height: 36px;
      line-height: 1.5;
      transition: border-color 0.12s;
    }

    .adjust-input:focus { border-color: var(--border-hi); }
    .adjust-input::placeholder { color: var(--faint); }

    .btn-adjust {
      height: 36px;
      padding: 0 16px;
      background: var(--raised);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn-adjust:hover { background: var(--border); }

    /* ── Modals ────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: #131313;
      border: 1px solid rgba(255,255,255,0.55);
      border-radius: 10px;
      width: 580px;
      max-height: 78vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
      font-family: var(--font);
      transition: color 0.12s;
    }

    .modal-close:hover { color: var(--text); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }

    /* History entries */
    .history-empty {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 32px 0;
    }

    .history-entry {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: opacity 0.1s;
    }

    .history-entry:last-child { border-bottom: none; }
    .history-entry:hover { opacity: 0.75; }

    .history-meta {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 5px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .history-raw {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }

    .history-refined {
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Better versions */
    .analysis-box {
      background: var(--raised);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .analysis-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .analysis-text {
      font-size: 12px;
      color: var(--text);
      line-height: 1.65;
    }

    .alt-item {
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: border-color 0.12s;
    }

    .alt-item:hover { border-color: rgba(255,255,255,0.35); }

    .alt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }

    .alt-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .btn-use {
      background: var(--btn-bg);
      border: none;
      border-radius: 4px;
      padding: 3px 10px;
      color: var(--btn-fg);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.12s;
    }

    .btn-use:hover { opacity: 0.85; }

    .alt-text {
      font-size: 12px;
      color: var(--text);
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .btn-keep {
      background: none;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: var(--radius);
      padding: 7px 24px;
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-keep:hover { color: var(--text); border-color: rgba(255,255,255,0.5); }

    .improve-loading {
      text-align: center;
      padding: 40px 0;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-dot"></div>
        Llama
        <span class="logo-version">v3</span>
      </div>

      <nav class="tabs">
        <button class="tab active" data-mode="refine">Quick Refine</button>
        <button class="tab" data-mode="precision">Precision</button>
        <button class="tab" data-mode="creative">Creative</button>
        <button class="tab" data-mode="code">Code</button>
      </nav>

      <div class="header-end">
        <div class="status-dot" id="statusDot" title="Ollama status"></div>
        <span class="header-label">Voice</span>
        <span class="header-label" style="cursor:pointer" onclick="openHistory()">History</span>
      </div>
    </header>

    <!-- Body -->
    <div class="body">

      <!-- Left panel -->
      <aside class="panel-left">

        <!-- Idea input -->
        <div class="panel-section">
          <div class="section-label">Your idea</div>
          <div class="idea-wrap">
            <textarea
              id="ideaInput"
              class="idea-textarea"
              placeholder="Enter your idea below…"
              spellcheck="false"
              rows="4"
            ></textarea>
            <div class="char-count" id="charCount"></div>
          </div>
        </div>

        <!-- Mode list -->
        <div class="panel-section" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
          <div class="section-label">Mode</div>
          <div class="mode-list">
            <button class="mode-btn active" data-mode="refine">
              <div class="mode-indicator"></div>
              <div class="mode-text">
                <span class="mode-name">Quick Refine</span>
                <span class="mode-desc">Clean, structured prompt from your raw idea.</span>
              </div>
            </button>
            <button class="mode-btn" data-mode="precision">
              <div class="mode-indicator"></div>
              <div class="mode-text">
                <span class="mode-name">Precision</span>
                <span class="mode-desc">Step-by-step, zero-ambiguity instructions.</span>
              </div>
            </button>
            <button class="mode-btn" data-mode="creative">
              <div class="mode-indicator"></div>
              <div class="mode-text">
                <span class="mode-name">Creative</span>
                <span class="mode-desc">Vivid, evocative prompt for creative tasks.</span>
              </div>
            </button>
            <button class="mode-btn" data-mode="code">
              <div class="mode-indicator"></div>
              <div class="mode-text">
                <span class="mode-name">Code</span>
                <span class="mode-desc">Technical spec for engineering tasks.</span>
              </div>
            </button>
          </div>
        </div>

        <!-- Action row -->
        <div class="actions">
          <button class="btn-record" id="recordBtn" onclick="toggleRecord()">
            <div class="rec-dot"></div>
            <span id="recordLabel">Record</span>
          </button>
          <button class="btn-refine" id="refineBtn" onclick="doRefine()">
            Refine &nbsp; ⌘↵
          </button>
        </div>

      </aside>

      <!-- Right panel -->
      <section class="panel-right">

        <div class="output-header">
          <span class="output-mode-label" id="outputModeLabel">Quick Refine</span>
          <div class="output-actions">
            <button class="btn-sm" id="improveBtn" onclick="openImprove()" style="display:none">Better versions</button>
            <button class="btn-sm" id="copyBtn" onclick="copyOutput()" style="display:none">Copy</button>
          </div>
        </div>

        <div class="output-body" id="outputBody">
          <div class="output-empty">Your refined prompt will appear here.</div>
        </div>

        <!-- Adjust row (shows after first output) -->
        <div class="adjust-section" id="adjustSection">
          <textarea
            class="adjust-input"
            id="adjustInput"
            placeholder="Adjust this prompt…"
            rows="1"
          ></textarea>
          <button class="btn-adjust" onclick="doAdjust()">Adjust</button>
        </div>

      </section>
    </div>
  </div>

  <!-- History modal -->
  <div class="modal-overlay" id="historyOverlay" onclick="closeOnBg(event,'historyOverlay')">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">History</span>
        <button class="modal-close" onclick="closeModal('historyOverlay')">×</button>
      </div>
      <div class="modal-body" id="historyBody">
        <div class="history-empty">No refinements yet.</div>
      </div>
    </div>
  </div>

  <!-- Better versions modal -->
  <div class="modal-overlay" id="improveOverlay" onclick="closeOnBg(event,'improveOverlay')">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Better versions</span>
        <button class="modal-close" onclick="closeModal('improveOverlay')">×</button>
      </div>
      <div class="modal-body" id="improveBody">
        <div class="improve-loading">Analyzing…</div>
      </div>
      <div class="modal-footer">
        <button class="btn-keep" onclick="closeModal('improveOverlay')">Keep current</button>
      </div>
    </div>
  </div>

  <script>
    /* ── State ──────────────────────────────────────────── */
    let activeMode    = 'refine';
    let currentOutput = '';
    let isLoading     = false;
    let isRecording   = false;
    let mediaRecorder = null;
    let audioChunks   = [];

    const modeMeta = {
      refine:    'Quick Refine',
      precision: 'Precision',
      creative:  'Creative',
      code:      'Code',
    };

    /* ── Mode selection ─────────────────────────────────── */
    function selectMode(mode) {
      activeMode = mode;

      document.querySelectorAll('.tab').forEach(el =>
        el.classList.toggle('active', el.dataset.mode === mode));

      document.querySelectorAll('.mode-btn').forEach(el =>
        el.classList.toggle('active', el.dataset.mode === mode));

      document.getElementById('outputModeLabel').textContent = modeMeta[mode] || mode;
    }

    document.querySelectorAll('.tab, .mode-btn').forEach(el => {
      el.addEventListener('click', () => selectMode(el.dataset.mode));
    });

    /* ── Char count ─────────────────────────────────────── */
    const ideaInput = document.getElementById('ideaInput');

    ideaInput.addEventListener('input', () => {
      const n = ideaInput.value.length;
      document.getElementById('charCount').textContent = n ? `${n} chars` : '';
      autoResize(ideaInput);
    });

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    /* ── Keyboard shortcut ──────────────────────────────── */
    ideaInput.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        doRefine();
      }
    });

    document.getElementById('adjustInput').addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        doAdjust();
      }
    });

    /* ── Refine ─────────────────────────────────────────── */
    async function doRefine() {
      const text = ideaInput.value.trim();
      if (!text || isLoading) return;

      startLoading();

      try {
        const resp = await fetch('/refine', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ text, mode: activeMode, current: '' }),
        });

        await streamResponse(resp);
      } catch (e) {
        showText('Error: ' + e.message);
      } finally {
        stopLoading();
      }
    }

    /* ── Adjust ─────────────────────────────────────────── */
    async function doAdjust() {
      const adjustment = document.getElementById('adjustInput').value.trim();
      if (!adjustment || !currentOutput || isLoading) return;

      startLoading();

      try {
        const resp = await fetch('/refine', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ text: adjustment, mode: 'iterate', current: currentOutput }),
        });

        document.getElementById('adjustInput').value = '';
        await streamResponse(resp);
      } catch (e) {
        showText('Error: ' + e.message);
      } finally {
        stopLoading();
      }
    }

    /* ── SSE stream reader ──────────────────────────────── */
    async function streamResponse(resp) {
      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let   result  = '';
      let   buf     = '';

      setOutputText('', true); // show cursor while streaming

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') { reader.cancel(); break; }
          try {
            const parsed = JSON.parse(payload);
            if (parsed.token) { result += parsed.token; setOutputText(result, true); }
            if (parsed.error) { showText('Error: ' + parsed.error); return; }
          } catch {}
        }
      }

      currentOutput = result.trim();
      setOutputText(currentOutput, false);
      afterOutput();
    }

    /* ── Output helpers ─────────────────────────────────── */
    function startLoading() {
      isLoading = true;
      document.getElementById('refineBtn').disabled = true;
      document.getElementById('copyBtn').style.display    = 'none';
      document.getElementById('improveBtn').style.display = 'none';
      document.getElementById('adjustSection').classList.remove('visible');

      const skels = [75, 92, 58, 82, 46, 70, 38, 64, 50]
        .map(w => `<div class="skel-line" style="width:${w}%"></div>`).join('');
      document.getElementById('outputBody').innerHTML =
        `<div class="skeleton">${skels}</div>`;
    }

    function stopLoading() {
      isLoading = false;
      document.getElementById('refineBtn').disabled = false;
    }

    function setOutputText(text, showCursor) {
      const body = document.getElementById('outputBody');
      if (!body.querySelector('.output-text')) {
        body.innerHTML = '<div class="output-text"></div>';
      }
      const el = body.querySelector('.output-text');
      el.textContent = text;
      if (showCursor) {
        const c = document.createElement('span');
        c.className = 'cursor';
        el.appendChild(c);
      }
    }

    function showText(text) {
      document.getElementById('outputBody').innerHTML =
        `<div class="output-text">${escHtml(text)}</div>`;
    }

    function afterOutput() {
      document.getElementById('copyBtn').style.display    = 'block';
      document.getElementById('improveBtn').style.display = 'block';
      document.getElementById('adjustSection').classList.add('visible');
      // Save to history
      saveHistory(ideaInput.value.trim(), activeMode, modeMeta[activeMode], currentOutput);
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ── Copy ───────────────────────────────────────────── */
    function copyOutput() {
      if (!currentOutput) return;
      navigator.clipboard.writeText(currentOutput);
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✓ Copied';
      btn.classList.add('active');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('active'); }, 2000);
    }

    /* ── Voice recording ────────────────────────────────── */
    async function toggleRecord() {
      if (isRecording) {
        stopRecording();
      } else {
        await startRecording();
      }
    }

    function getSupportedMimeType() {
      for (const t of ['audio/webm', 'audio/mp4', 'audio/ogg']) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return '';
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks  = [];
        const mimeType = getSupportedMimeType();
        mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          await sendAudio(blob);
        };

        mediaRecorder.start(100);
        isRecording = true;

        const btn = document.getElementById('recordBtn');
        btn.classList.add('recording');
        document.getElementById('recordLabel').textContent = 'Stop';
      } catch (err) {
        alert('Microphone access denied. Allow mic access in your browser to use voice input.');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      const btn = document.getElementById('recordBtn');
      btn.classList.remove('recording');
      document.getElementById('recordLabel').textContent = 'Transcribing…';
      btn.disabled = true;
    }

    async function sendAudio(blob) {
      try {
        const form = new FormData();
        form.append('audio', blob, 'recording.webm');
        const resp = await fetch('/transcribe', { method: 'POST', body: form });
        const data = await resp.json();
        if (data.text) {
          ideaInput.value = data.text;
          autoResize(ideaInput);
          const n = data.text.length;
          document.getElementById('charCount').textContent = `${n} chars`;
        }
      } catch (e) {
        console.error('Transcription error:', e);
      } finally {
        document.getElementById('recordLabel').textContent = 'Record';
        document.getElementById('recordBtn').disabled = false;
      }
    }

    /* ── History ────────────────────────────────────────── */
    const sessionHistory = [];

    function saveHistory(raw, mode, modeLabel, refined) {
      const ts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      sessionHistory.unshift({ ts, raw, mode, modeLabel, refined });
    }

    function openHistory() {
      const body = document.getElementById('historyBody');
      if (sessionHistory.length === 0) {
        body.innerHTML = '<div class="history-empty">No refinements yet.</div>';
      } else {
        body.innerHTML = sessionHistory.map((e, i) => `
          <div class="history-entry" onclick="loadHistory(${i})">
            <div class="history-meta">${e.ts} &nbsp;·&nbsp; ${escHtml(e.modeLabel)}</div>
            <div class="history-raw">↳ ${escHtml(e.raw)}</div>
            <div class="history-refined">${escHtml(e.refined.slice(0, 120))}${e.refined.length > 120 ? '…' : ''}</div>
          </div>`).join('');
      }
      openModal('historyOverlay');
    }

    function loadHistory(index) {
      const e = sessionHistory[index];
      if (!e) return;
      closeModal('historyOverlay');
      ideaInput.value = e.raw;
      autoResize(ideaInput);
      document.getElementById('charCount').textContent = e.raw.length ? `${e.raw.length} chars` : '';
      selectMode(e.mode);
      currentOutput = e.refined;
      setOutputText(e.refined, false);
      afterOutput();
    }

    /* ── Better versions ────────────────────────────────── */
    async function openImprove() {
      if (!currentOutput) return;
      const raw = ideaInput.value.trim();

      document.getElementById('improveBody').innerHTML =
        '<div class="improve-loading">Analyzing weak points and generating alternatives…</div>';
      openModal('improveOverlay');

      try {
        const resp = await fetch('/improve', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ raw, refined: currentOutput }),
        });
        const data = await resp.json();

        if (data.error) {
          document.getElementById('improveBody').innerHTML =
            `<div class="improve-loading">Error: ${escHtml(data.error)}</div>`;
          return;
        }

        const altsHtml = (data.alternatives || []).map((alt, i) => `
          <div class="alt-item">
            <div class="alt-header">
              <span class="alt-label">Option ${i + 1}</span>
              <button class="btn-use" onclick="useAlternative(${i})">Use this</button>
            </div>
            <div class="alt-text" id="alt-text-${i}">${escHtml(alt)}</div>
          </div>`).join('');

        document.getElementById('improveBody').innerHTML = `
          <div class="analysis-box">
            <div class="analysis-label">Weak points</div>
            <div class="analysis-text">${escHtml(data.analysis || '')}</div>
          </div>
          ${altsHtml}`;

        // Store alternatives for use
        window._currentAlternatives = data.alternatives || [];
      } catch (e) {
        document.getElementById('improveBody').innerHTML =
          `<div class="improve-loading">Error: ${escHtml(e.message)}</div>`;
      }
    }

    function useAlternative(index) {
      const alts = window._currentAlternatives || [];
      if (alts[index]) {
        currentOutput = alts[index];
        setOutputText(currentOutput, false);
        saveHistory(ideaInput.value.trim(), activeMode, modeMeta[activeMode], currentOutput);
        closeModal('improveOverlay');
      }
    }

    /* ── Modal helpers ──────────────────────────────────── */
    function openModal(id)  { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    function closeOnBg(e, id) { if (e.target.id === id) closeModal(id); }

    /* ── Health check ───────────────────────────────────── */
    async function checkHealth() {
      try {
        const resp = await fetch('/health');
        const data = await resp.json();
        document.getElementById('statusDot').classList.toggle('online', !!data.ollama);
      } catch {}
    }

    checkHealth();
    setInterval(checkHealth, 15000);
  </script>
</body>
